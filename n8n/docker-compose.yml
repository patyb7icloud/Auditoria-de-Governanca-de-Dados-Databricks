services:
  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-2.19.5}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      WEBHOOK_URL: ${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_TIMEOUT: ${EXECUTIONS_TIMEOUT:-1800}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
